# Config of a run. Copy this file into runs/<name>/. Types and defaults: workflow/schemas/config.schema.yaml.
# README.md, section "Configuration", explains the keys.

# The samples file: condition, replicate name, left reads, right reads (none for single-end).
samples_file: "samples.txt"

# Trimmomatic steps. {adapters} is resources/adapters.fasta.
trimmomatic_parameters: "ILLUMINACLIP:{adapters}:2:30:10 SLIDINGWINDOW:4:5 LEADING:5 TRAILING:5 MINLEN:25"

# trinity or rnaspades.
assembler: "trinity"

# Environment variable that holds the node-local folder of a cluster job, for example "$SCRATCH". "" works in the run folder.
# In a profile or with --config write it without the $ (SCRATCH).
scratch: ""

# Extra Trinity options.
trinity_parameters: "--seqType fq"

# TargetP organism group: pl or non-pl. "" turns TargetP off.
targetp: "non-pl"

# SignalP organism group: eukarya or other. "" turns SignalP off.
signalp: "eukarya"

# Path of a .sif image of SignalP or TargetP. "" runs the tool in the conda env of that name.
signalp_container: ""
targetp_container: ""

# Read strand. Trinity: "--SS_lib_type RF" (paired RF or FR, single F or R). rnaSPAdes: "--ss rf" or "--ss fr". "" is unstranded.
strand_specific: ""

# rnaSPAdes only: the transcript set that becomes transcriptome.fasta: default, hard (long, well expressed) or soft (also short, low expressed).
rnaspades_filter: "default"

# rnaSPAdes only: k-mer sizes, odd, below 128, ascending, for example "-k 21,33,55". "" lets rnaSPAdes choose.
kmers: ""

# Text put before each sequence name in the annotated files.
annotated_fasta_prefix: ""

# E-value limit of the Pfam, Rfam and BLAST searches.
e_value_threshold: "1e-6"

# edgeR dispersion for a pair of conditions where a condition has one replicate.
dispersion: "0.1"

# BUSCO lineage, for example "eudicots_odb10" (busco --list-datasets). "" lets BUSCO choose.
lineage: "viridiplantae_odb12"

# Database folder. "resources/db" is downloaded into the run folder. Any other folder is a shared copy that is only read.
db_dir: "resources/db"

# Database releases. Keep the quotes.
pfam_release: "38.2"
rfam_release: "15.1"
sprot_release: "2026_03"

# Sequences in each annotation job: transcripts (rfam, blastx), long ORFs (pfam, blastp), proteins (tmhmm, signalp, targetp).
annotation_chunk_fasta: 1000
annotation_chunk_orfs: 5000
annotation_chunk_pep: 5000

# Memory (GB), threads and time limit (minutes, or "30m", "12h", "7d") of the rules that grow with the data.
# The values suit about 420 million read pairs (18 libraries). Keep the assembler threads the same in runs that you compare.
rnaspades_memory: "400"
rnaspades_threads: 32
rnaspades_runtime: "1d"
# About 1 GB per million read pairs (Trinity guide); not measured.
trinity_memory: "450"
trinity_threads: 32
trinity_runtime: "7d"
align_reads_memory: "100"
align_reads_threads: 16
align_reads_runtime: "3d"
kallisto_memory: "20"
kallisto_threads: 16
kallisto_runtime: "4h"
busco_memory: "10"
busco_threads: 16
busco_runtime: "4h"
transdecoder_predict_memory: "6"
transdecoder_predict_threads: 1
transdecoder_predict_runtime: "4h"
# Time follows annotation_chunk_fasta.
sprot_blastx_memory: "2"
sprot_blastx_threads: 4
sprot_blastx_runtime: "12h"
