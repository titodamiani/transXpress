channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - snakemake=7.32.4      # Snakemake 8 removed --cluster
  - pulp<2.8              # Snakemake 7.32.4 calls pulp.list_solvers, removed in pulp 2.8
  - setuptools<82         # Snakemake 7 imports pkg_resources, removed in setuptools 82
  - numpy<1.24            # tmhmm.py 1.2.1 uses np.int, removed in numpy 1.24
  - cython<3              # needed to build tmhmm.py from source
  - gcc
  - pip
  - biopython
  - pandas
  - matplotlib-base>3.3.2
  - seqkit
  - wget
  - sra-tools
  - pip:
    - tmhmm.py==1.2.1
