# Aurum cluster (IOCB Prague): profiles/slurm plus the Aurum settings. aurum.md in the project folder describes the env.
# Run from the clone, with the snakemake9 env active: snakemake --profile profiles/aurum -d runs/<name>

executor: slurm
# The rule envs come from the main image (MAIN_IMAGE in workflow/Snakefile); apptainer also runs SignalP and TargetP from their images.
software-deployment-method:
  - conda
  - apptainer
# The image is <md5 of the MAIN_IMAGE URL>.simg in this folder. Pull it first, in a Slurm job.
apptainer-prefix: /uochb/soft/users/titodamiani/images/transxpress
# Bind what a job in the image reads: scratch, the clone with the shared databases, the reads.
apptainer-args: "--bind /scratch,/uochb/people/titodamiani,/uochb/project/pluskal_group"
snakefile: ../../workflow/Snakefile
# Rule envs of a run with conda alone, shared by all runs.
conda-prefix: /uochb/soft/users/titodamiani/conda-envs/snakemake/transxpress
jobs: 50
max-jobs-per-timespan: "1/1s"
latency-wait: 60
restart-times: 1
rerun-incomplete: true

default-resources:
  # One CPU generation (AMD EPYC 9654), so two runs give the same assembly
  constraint: "'gen-d'"
  # $SCRATCH is in RAM on d001
  slurm_extra: "'--exclude=d001'"

# A --config on the command line replaces this list, so add scratch=SCRATCH to it.
config:
  # Without the $: the sbatch line passes the value through a shell.
  scratch: "SCRATCH"
