# Snakemake profile for the Aurum cluster (IOCB Prague): profiles/slurm plus the Aurum settings.
# Run in a run folder, with the snakemake9 env active:
#   snakemake --profile /path/to/transXpress/profiles/aurum
# aurum.md in the project folder describes the env and the launcher.

executor: slurm
software-deployment-method: conda
snakefile: ../../workflow/Snakefile
# the rule envs, shared by all runs
conda-prefix: /uochb/soft/users/titodamiani/conda-envs/snakemake/transxpress
jobs: 50
max-jobs-per-timespan: "1/1s"
latency-wait: 60
restart-times: 1
rerun-incomplete: true

default-resources:
  # One CPU generation (AMD EPYC 9654), so two runs give the same assembly
  constraint: "'gen-d'"
  # d035 kills every job, and on d001 $SCRATCH is in RAM
  slurm_extra: "'--exclude=d001,d035'"

config:
  # The heavy rules work in the job's folder on the node's local disk, $SCRATCH. The name goes without
  # its $, because the sbatch line passes it through a shell, which would put in the main job's folder.
  scratch: "SCRATCH"
