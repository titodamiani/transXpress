# Snakemake profile for one computer, for example a laptop or a single cluster node.
# Run from the folder of the clone, in a run folder: snakemake --profile profiles/local -d runs/<name>
# The rules run with at most the computer's cores. A rule that asks for more threads gets fewer.

cores: all
software-deployment-method: conda
snakefile: ../../workflow/Snakefile
rerun-incomplete: true
