# profile config.yaml for a slurm cluster
# The cluster picks the partition from the time and memory of each job.
# If your cluster needs a partition name, add --partition=<name> to the sbatch line below.
#
# Two places take flags that belong to one cluster and not to the pipeline.
# TRANSXPRESS_SBATCH_EXTRA applies to every job of a run, for example
#   export TRANSXPRESS_SBATCH_EXTRA="--constraint=gen-d --exclude=badnode1"
# An assembly that is to be compared with another one needs the same CPU on both
# runs, so a constraint that names the processor generation belongs here.
# The extra resource applies to one rule, through set-resources below, for example
#   - rnaspades:extra="--nodelist=node42"
# Snakemake formats the sbatch line before a shell sees it, so a brace that the
# shell has to read is written twice.

cluster:
  sbatch
    --nodes=1
    --cpus-per-task={threads}
    --mem={params.memory}GB
    --time={resources.time}
    -o {log}.slurm
    --parsable
    {resources.extra}
    ${{TRANSXPRESS_SBATCH_EXTRA:-}}

# time limits for jobs which need more than the default time
set-resources:
  - sprot_blastx_parallel:time="12:00:00"
  - trinity_butterfly_parallel:time="12:00:00"
  - kallisto:time="12:00:00"
  - trinity_final:time="2-00:00:00"
  - align_reads:time="3-00:00:00"
  - rnaspades:time="3-00:00:00"
  - trinity_inchworm_chrysalis:time="5-00:00:00"

default-resources:
  - time="4:00:00"
  # no extra sbatch flags unless a rule asks for them in set-resources
  - extra=""
# Asks Slurm for the state of each job. Without it, Snakemake waits for the job
# to write a marker file, and a job killed by the node writes none.
# Snakemake looks for the script next to this file.
cluster-status: slurm-status.sh
restart-times: 1
latency-wait: 60
# Trinity splits the Butterfly stage into 1000 chunks, so this number is the size
# of the queue during that stage. Keep it low enough that one node is not filled.
jobs: 100
rerun-incomplete: True
conda-frontend: "conda"
use-conda: True
