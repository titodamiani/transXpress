# Slurm cluster, with snakemake-executor-plugin-slurm. Run from the clone: snakemake --profile profiles/slurm -d runs/<name>
# Site flags (constraint, slurm_partition, slurm_account, slurm_extra) go in a copy of this folder, see profiles/aurum
# and README.md "Configuration". A text value needs two pairs of quotes: slurm_extra: "'--exclude=node1'".
# slurm_extra cannot hold a flag the plugin sets itself (--constraint, --time, --mem, --partition, --cpus-per-task).

executor: slurm
software-deployment-method: conda
# Snakemake turns a path that exists next to this file into an absolute path, so the profile works with any -d folder.
snakefile: ../../workflow/Snakefile
jobs: 50
max-jobs-per-timespan: "1/1s"
latency-wait: 60
restart-times: 1
rerun-incomplete: true
