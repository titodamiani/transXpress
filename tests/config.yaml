# Config of the T1 test runs (tests/make_run.sh). Keys: config.yaml.
samples_file: "test_samples.txt"
trimmomatic_parameters: "ILLUMINACLIP:{adapters}:3:30:10 SLIDINGWINDOW:4:20 LEADING:20 TRAILING:20 MINLEN:25"
assembler: "trinity"
rnaspades_filter: "default"
scratch: ""
trinity_parameters: "--seqType fq"
targetp: "non-pl"
signalp_container: ""
targetp_container: ""
strand_specific: ""
annotated_fasta_prefix: "test_prefix"
e_value_threshold: "1e-6"
dispersion: "0.1"
annotation_chunk_fasta: 1000
annotation_chunk_orfs: 5000
annotation_chunk_pep: 5000

# Small figures for the test data. Trinity passes the memory to samtools sort, so it must fit the computer (a GitHub runner has 16 GB).
rnaspades_memory: "300"
rnaspades_threads: 16
trinity_memory: "8"
trinity_threads: 16
align_reads_memory: "100"
align_reads_threads: 16
kallisto_memory: "16"
kallisto_threads: 8
busco_memory: "10"
busco_threads: 4
transdecoder_predict_memory: "10"
transdecoder_predict_threads: 1
