channels:
  - conda-forge
  - bioconda
dependencies:
  # The same Python as envs/tmhmm.yaml. A script: rule in another env loads the snakemake package of
  # this env, so both envs need the same Python version.
  - python=3.11
  - snakemake=9.27.0
  - snakemake-executor-plugin-slurm=2.8.0
  - snakemake-executor-plugin-cluster-generic=1.0.9
  - biopython
  - pandas
  - matplotlib-base>3.3.2
  - seqkit
  - wget
  - sra-tools
